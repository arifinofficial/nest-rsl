name: Publish

# Stages a release on npm when a vX.Y.Z tag is pushed. Uses npm trusted publishing (OIDC):
# no token is stored anywhere. The trusted publisher on npmjs.com allows staging only, so
# the staged version goes live after a maintainer approves it with 2FA.

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check release tag
        run: bash scripts/check-release.sh "$GITHUB_REF_NAME"

      - uses: pnpm/action-setup@v4

      # No registry-url here: it sets NODE_AUTH_TOKEN, which overrides the OIDC flow.
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm test

      - run: pnpm build

      - name: Install an npm CLI with staged publishing
        run: npm install -g npm@^11.15.0

      - name: Stage the release on npm
        run: npm stage publish --provenance --access public

      - name: Summary
        run: |
          version=$(node -p "require('./package.json').version")
          {
            echo "### @fintastic/nest-rsl@${version} is staged on npm"
            echo
            echo "It is not live yet. Approve it with 2FA on npmjs.com, or run \`npm stage approve <id>\`."
          } >> "$GITHUB_STEP_SUMMARY"
